version: 1
backend:
  phases:
    build:
      commands:
        # npm install statt npm ci: package-lock.json ist bewusst nicht
        # versioniert, npm ci setzt sie aber voraus.
        - npm install
        # Deployt Cognito, AppSync/DynamoDB und die Lambdas und erzeugt
        # anschliessend amplify_outputs.json fuer den Frontend-Build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
